<span class="info-tooltip">
  <button
    #trigger
    class="info-tooltip__trigger"
    type="button"
    [attr.aria-describedby]="open() ? id : null"
    [attr.aria-label]="ariaLabel()"
    (blur)="hide()"
    (focus)="show()"
    (mouseenter)="show()"
    (mouseleave)="hide()"
  >
    <svg lucideCircleHelp size="14" aria-hidden="true"></svg>
  </button>
  @if (open()) {
    <span class="info-tooltip__bubble" role="tooltip" [id]="id" [ngStyle]="bubbleStyle()">{{ text() }}</span>
  }
</span>
