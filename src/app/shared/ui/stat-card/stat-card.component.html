<article class="stat-card">
  <div class="stat-card__icon" [class]="toneClass()">
    @if (iconComponent(); as icon) {
      <ng-container *ngComponentOutlet="icon" />
    } @else {
      <span>{{ icon() }}</span>
    }
  </div>
  <div class="stat-card__content">
    <div class="stat-card__label">
      <p>{{ label() }}</p>
      @if (info()) {
        <app-info-tooltip [text]="info()" [label]="'Información sobre ' + label()" />
      }
    </div>
    <strong>{{ value() }}</strong>
    @if (hint()) {
      <small>{{ hint() }}</small>
    }
  </div>
</article>
