<article class="stat-card">
  <div class="stat-card__icon" [class]="toneClass()">
    @if (iconComponent(); as icon) {
      <ng-container *ngComponentOutlet="icon" />
    } @else {
      <span>{{ icon() }}</span>
    }
  </div>
  <div>
    <p>{{ label() }}</p>
    <strong>{{ value() }}</strong>
    @if (hint()) {
      <small>{{ hint() }}</small>
    }
  </div>
</article>
