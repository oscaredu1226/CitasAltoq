    @if (batch(); as b) {
      <app-page-title [title]="b.fileName" subtitle="Detalle read-only del lote importado.">
        <app-status-badge kind="import" [value]="b.status" />
      </app-page-title>
      <section class="stat-grid">
        <app-stat-card label="Filas totales" [value]="b.totalRows" icon="F" tone="blue" />
        <app-stat-card label="Dentro del ámbito" [value]="b.rowsInScope" icon="A" tone="green" />
        <app-stat-card label="Excluidas" [value]="b.rowsExcludedByScope" icon="E" tone="amber" />
        <app-stat-card label="Errores" [value]="b.errorRows" icon="!" tone="red" />
        <app-stat-card label="Pacientes nuevos" [value]="b.newPatients" icon="P" tone="green" />
        <app-stat-card label="Actualizados" [value]="b.updatedPatients" icon="U" tone="blue" />
        <app-stat-card label="Citas nuevas" [value]="b.newAppointments" icon="C" tone="green" />
        <app-stat-card label="Reprogramadas" [value]="b.rescheduledAppointments" icon="R" tone="purple" />
      </section>
      <article class="panel">
        <h2>Información técnica</h2>
        <div class="info-grid">
          <span><small>ID batch</small><strong>{{ b.id }}</strong></span>
          <span><small>Checksum</small><strong>{{ b.fileChecksum }}</strong></span>
          <span><small>Inicio</small><strong>{{ formatDateTime(b.startedAt) }}</strong></span>
          <span><small>Fin</small><strong>{{ formatDateTime(b.finishedAt) }}</strong></span>
          <span><small>Ámbito</small><strong>{{ scopeText(b.scope) }}</strong></span>
          <span><small>Error</small><strong>{{ b.errorMessage || '-' }}</strong></span>
        </div>
      </article>
      <a class="button" routerLink="/importaciones">← Volver</a>
    }
