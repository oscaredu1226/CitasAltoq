    <div class="app-shell" [class.sidebar-open]="sidebarOpen()">
      <aside class="sidebar">
        <a class="sidebar__brand" routerLink="/dashboard" aria-label="Ir al dashboard">
          <app-logo />
        </a>
        <nav class="sidebar__nav" aria-label="Principal">
          @for (item of visibleNav(); track item.path) {
            <a [routerLink]="item.path" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }">
              <span aria-hidden="true">{{ item.icon }}</span>
              {{ item.label }}
            </a>
          }
        </nav>
        <div class="session-card">
          <strong>Acceso protegido</strong>
          <span>Sesión activa</span>
          @if (scopeText(); as scope) {
            <small>{{ scope }}</small>
          }
        </div>
      </aside>

      <div class="shell-main">
        <header class="topbar">
          <button class="icon-button menu-button" type="button" (click)="sidebarOpen.set(!sidebarOpen())" aria-label="Abrir menú">☰</button>
          <form class="global-search" role="search" (submit)="search(searchInput.value); $event.preventDefault()">
            <span aria-hidden="true">⌕</span>
            <input #searchInput type="search" placeholder="Buscar documento de paciente..." aria-label="Buscar paciente por documento" />
            <kbd>Ctrl + K</kbd>
          </form>
          <button class="icon-button" type="button" aria-label="Notificaciones">
            ◌
            <span class="notification-dot">3</span>
          </button>
          <div class="user-menu">
            <div class="avatar" aria-hidden="true">{{ initials() }}</div>
            <div>
              <strong>{{ user()?.displayName || 'Usuario' }}</strong>
              <span>{{ roleText() }}</span>
              @if (scopeText(); as scope) {
                <small>{{ scope }}</small>
              }
            </div>
            <button class="button button--ghost" type="button" (click)="auth.logout()">Cerrar sesión</button>
          </div>
        </header>
        <main class="content">
          <router-outlet />
        </main>
      </div>
    </div>
