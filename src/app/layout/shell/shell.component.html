    <div class="app-shell" [class.sidebar-open]="sidebarOpen()" [class.sidebar-collapsed]="sidebarCollapsed()">
      <aside class="sidebar">
        <div class="sidebar__header">
          <a class="sidebar__brand" routerLink="/dashboard" aria-label="Ir al dashboard" (click)="closeSidebarOnNavigation()">
            <app-logo />
          </a>
          <button class="icon-button sidebar-toggle" type="button" (click)="toggleSidebar()" [attr.aria-expanded]="sidebarOpen() || !sidebarCollapsed()" aria-label="Alternar menú lateral">
            <svg lucideMenu size="20" aria-hidden="true"></svg>
          </button>
        </div>
        <nav class="sidebar__nav" aria-label="Principal">
          @for (item of visibleNav(); track item.path) {
            <a [routerLink]="item.path" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }" (click)="closeSidebarOnNavigation()">
              <span aria-hidden="true"><ng-container *ngComponentOutlet="item.icon" /></span>
              {{ item.label }}
            </a>
          }
        </nav>
      </aside>

      <div class="shell-main">
        <header class="topbar">
          <button class="icon-button menu-button mobile-menu-button" type="button" (click)="toggleSidebar()" [attr.aria-expanded]="sidebarOpen()" aria-label="Abrir menú lateral">
            <svg lucideMenu size="20" aria-hidden="true"></svg>
          </button>
          <div class="user-menu">
            <div class="avatar" aria-hidden="true">{{ initials() }}</div>
            <div>
              <strong>{{ user()?.displayName || 'Usuario' }}</strong>
              <span>{{ roleText() }}</span>
              @if (admin()) {
                <small>Acceso global</small>
              } @else {
                <small>{{ establishmentText() }}</small>
                <small>{{ microredText() }}</small>
                <small>{{ redText() }}</small>
              }
            </div>
            <button class="button button--ghost" type="button" (click)="auth.logout()">Cerrar sesión</button>
          </div>
        </header>
        <main class="content">
          <router-outlet />
        </main>
      </div>
    </div>
